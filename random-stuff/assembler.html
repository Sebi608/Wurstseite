<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Ein einfacher Assembler und Disassembler zum Übersetzen zwischen Assembly-Code und Maschinencode.">
        <meta property="og:type" content="website">
        <meta property="og:image" content="https://team-wurstwasser.com/img/Logo.png">
        <title>Assembler & Disassembler | Team Wurstwasser</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="icon" type="image/png" sizes="256x256" href="/img/Logo.png">
        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="/css/assembler.css">
        <script src="/js/assembler/keystone.js"></script>
        <script src="/js/assembler/capstone.js"></script>
        <script src="/js/setup.js" defer></script>
        <script src="/js/assembler/assembler.js" defer></script>
    </head>

    <body>
        <header>
            <h1>ASSEMBLER & DISASSEMBLER</h1>
            <p class="motto">Assembliere Code in Maschinencode oder disassembliere Hex-Bytes zurück in Assembly:</p>
        </header>

        <main>
            <div class="container">
                <a class="back-link" href="/random-stuff.html">← Zurück zur Random-Stuff Seite</a>

                <section class="card">
                    <div class="tool-section">
                        <div class="assembler-controls">
                            <label for="asmArchSelect">Assembler Architektur:</label>
                            <select id="asmArchSelect">
                                <option value="x64">x86 (64-Bit)</option>
                                <option value="x32">x86 (32-Bit)</option>
                                <option value="x16">x86 (16-Bit)</option>
                                <option value="arm">ARM (Standard)</option>
                                <option value="arm_thumb">ARM (Thumb-Modus)</option>
                                <option value="aarch64">AArch64 (ARM 64-Bit)</option>
                                <option value="mips32">Mips (32-Bit)</option>
                                <option value="mips64">Mips (64-Bit)</option>
                                <option value="ppc32">PowerPC (32-Bit)</option>
                                <option value="ppc64">PowerPC (64-Bit)</option>
                                <option value="sparc">Sparc</option>
                            </select>
                        </div>

                        <div class="assembler-workspace">
                            <div class="editor-pane">
                                <div class="pane-title">Assembly Code (Eingabe)</div>
                                <textarea id="asmInput" placeholder="z.B. nop&#10;mov eax, 1"></textarea>
                            </div>
                            <div class="editor-pane">
                                <div class="pane-title">Maschinencode (Hex-Ausgabe)</div>
                                <textarea id="hexOutput" readonly placeholder="Generierter Hex-Code erscheint hier..."></textarea>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <div class="tool-section">
                        <div class="assembler-controls">
                            <label for="disArchSelect">Disassembler Architektur:</label>
                            <select id="disArchSelect">
                                <option value="x64">x86 (64-Bit)</option>
                                <option value="x32">x86 (32-Bit)</option>
                                <option value="x16">x86 (16-Bit)</option>
                                <option value="arm">ARM (Standard)</option>
                                <option value="arm_thumb">ARM (Thumb-Modus)</option>
                                <option value="aarch64">AArch64 (ARM 64-Bit)</option>
                                <option value="mips32">Mips (32-Bit)</option>
                                <option value="mips64">Mips (64-Bit)</option>
                                <option value="ppc32">PowerPC (32-Bit)</option>
                                <option value="ppc64">PowerPC (64-Bit)</option>
                                <option value="sparc">Sparc</option>
                            </select>
                        </div>

                        <div class="disassembler-options">
                            <div class="option-group">
                                <label><input type="radio" name="endian" value="le" checked> Little Endian</label>
                                <label><input type="radio" name="endian" value="be"> Big Endian</label>
                            </div>
                            
                            <div class="option-group base-addr-group">
                                <input type="text" id="baseAddrInput" value="0x00000000">
                                <span>Base addr</span>
                            </div>
                            
                            <div class="option-group">
                                <label><input type="checkbox" id="showAddresses" checked> Addresses</label>
                                <label><input type="checkbox" id="showBytes" checked> Bytecodes</label>
                                <label><input type="checkbox" id="showInstructions" checked> Instructions</label>
                            </div>
                        </div>

                        <div class="assembler-workspace">
                            <div class="editor-pane">
                                <div class="pane-title">Maschinencode (Hex-Eingabe)</div>
                                <textarea id="disHexInput" placeholder="z.B. 90 B8 01 00 00 00"></textarea>
                            </div>
                            <div class="editor-pane">
                                <div class="pane-title">Assembly Code</div>
                                <textarea id="disAsmOutput" readonly placeholder="Dekodierter Assembly-Code erscheint hier..."></textarea>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </body>
</html>
