<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Ein einfacher Base64-Decoder und -Encoder zum Codieren und Decodieren von Texten und Dateien in Base64.">
        <meta property="og:type" content="website">
        <meta property="og:image" content="https://team-wurstwasser.com/img/Logo.png">
        <title>Base64 Decoder & Encoder | Team Wurstwasser</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="icon" type="image/png" sizes="256x256" href="/img/Logo.png">
        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="/css/base64.css">
        <script src="/js/setup.js" defer></script>
        <script src="/js/base64.js" defer></script>
    </head>

    <body>
        <header>
            <h1>Base64 Decoder & Encoder</h1>
            <p class="motto">Codiere Texte und Dateien in Base64 oder decodiere sie zurück in Klartext:</p>
        </header>

        <main>
            <div class="container">
                <a class="back-link" href="/random-stuff.html">← Zurück zur Random-Stuff Seite</a>

                <section class="card">
                    <div class="tool-section">
                        <div class="crypto-controls">
                            <label>Base64 Encoder</label>
                        </div>

                        <div class="crypto-workspace">
                            <div class="crypto-pane">
                                <div class="pane-title">Klartext (Eingabe)</div>
                                <textarea id="encodeInput" placeholder="Gib hier Text ein oder ziehe eine Datei hierher..."></textarea>
                                
                                <div id="uploadContainer">
                                    <input type="file" id="encodeFile">
                                    <button type="button" id="file-btn" onclick="document.getElementById('encodeFile').click()">Datei auswählen</button>
                                </div>
                            </div>
                            <div class="crypto-pane">
                                <div class="pane-title">Base64 (Ausgabe)</div>
                                <textarea id="encodeOutput" readonly placeholder="Der codierte Base64-String erscheint hier..."></textarea>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <div class="tool-section">
                        <div class="crypto-controls">
                            <label>Base64 Decoder</label>
                        </div>

                        <div class="crypto-workspace">
                            <div class="crypto-pane">
                                <div class="pane-title">Base64 (Eingabe)</div>
                                <textarea id="decodeInput" placeholder="Füge einen Base64-String ein..."></textarea>
                            </div>
                            <div class="crypto-pane">
                                <div class="pane-title">Klartext (Ausgabe)</div>
                                <textarea id="decodeOutput" readonly placeholder="Der decodierte Klartext erscheint hier..."></textarea>
                                
                                <div id="downloadContainer">
                                    <button type="button" id="downloadBtn">Datei herunterladen</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </body>
</html>
