<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Ein einfacher Zahlen-Konverter zum Übersetzen zwischen Binär, Dezimal, Hexadezimal und Oktal.">
        <meta property="og:type" content="website">
        <meta property="og:image" content="https://team-wurstwasser.com/img/Logo.png">
        <link rel="canonical" href="https://team-wurstwasser.com/random-stuff/converter.html">
        <title>Zahlen-Konverter | Team Wurstwasser</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="icon" type="image/png" sizes="256x256" href="/img/Logo.png">
        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="/css/converter.css">
        <script src="/js/setup.js" defer></script>
        <script src="/js/converter.js" defer></script>
    </head>
    
    <body>
        <header>
            <h1>Zahlen-Konverter</h1>
            <p class="motto">Konvertiere Zahlen zwischen Binär, Dezimal, Hex und Oktal.</p>
        </header>

        <main>
            <div class="container">
                <a class="back-link" href="/random-stuff.html">← Zurück zur Random-Stuff Seite</a>

                <section class="card">
                    <div class="converter-controls-group">
                        <div class="converter-controls">
                            <label for="baseSelect">Eingabe-Basis:</label>
                            <select id="baseSelect">
                                <option value="10">Dezimal</option>
                                <option value="2">Binär</option>
                                <option value="16">Hexadezimal</option>
                                <option value="8">Oktal</option>
                            </select>
                        </div>

                        <div class="converter-controls">
                            <label for="outputBaseSelect">Ausgabe-Basis:</label>
                            <select id="outputBaseSelect">
                                <option value="10">Dezimal</option>
                                <option value="2" selected>Binär</option>
                                <option value="16">Hexadezimal</option>
                                <option value="8">Oktal</option>
                            </select>
                        </div>
                    </div>

                    <div class="converter-workspace">
                        <div class="converter-pane">
                            <div class="pane-title">Eingabe (Zahl)</div>
                            <textarea id="inputNumber" placeholder="Zahl eingeben..."></textarea>
                        </div> 
                        
                        <div class="converter-pane">
                            <div class="pane-title">Ergebnis</div>
                            <textarea id="resultsOutput" readonly placeholder="Ergebnis..."></textarea>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </body>
</html>
