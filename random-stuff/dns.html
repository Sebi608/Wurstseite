<!DOCTYPE html>
<html lang="de">   
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Ein einfacher DNS-Lookup-Tool zum Auflösen von Domains in IP-Adressen.">
        <meta property="og:type" content="website">
        <meta property="og:image" content="https://team-wurstwasser.com/img/Logo.png">
        <link rel="canonical" href="https://team-wurstwasser.com/random-stuff/dns.html">
        <title>DNS Lookup | Team Wurstwasser</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="icon" type="image/png" sizes="256x256" href="/img/Logo.png">
        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="/css/random-stuff/dns.css">
        <script src="/js/setup.js" defer></script>
        <script src="/js/random-stuff/dns.js" defer></script>
    </head>

    <body>
        <header>
            <h1>DNS Lookup</h1>
            <p class="motto">Finde mehr über eine Domain heraus:</p>
        </header>

        <div class="container">
            <a class="back-link" href="/random-stuff.html">← Zurück zur Random-Stuff Seite</a>

            <section class="card">
                <h2>Gib deine Domain ein:</h2>
                <div class="tool-ui">
                    <input type="text" id="domainInput" class="input-field" placeholder="z. B. team-wurstwasser.com" onkeydown="if(event.key === 'Enter') resolveDomain()">
                    <button onclick="resolveDomain()" class="btn" style="margin-top: 0;">Abfragen</button>
                </div>
                
                <div id="geoContainer" class="geo-container" style="display: none;">
                    <div class="geo-details-box">
                        <h3>Ergebnisse:</h3>
                        <table>
                            <tr><td><strong>Stadt:</strong></td><td id="geoCity">-</td></tr>
                            <tr><td><strong>Bundesland/Region:</strong></td><td id="geoRegion">-</td></tr>
                            <tr><td><strong>Land:</strong></td><td id="geoCountry">-</td></tr>
                            <tr><td><strong>Postleitzahl:</strong></td><td id="geoZip">-</td></tr>
                            <tr><td><strong>Zeitzone:</strong></td><td id="geoTimezone">-</td></tr>
                            <tr><td><strong>Anbieter:</strong></td><td id="geoIsp">-</td></tr>
                            <tr><td><strong>ASN:</strong></td><td id="geoAs">-</td></tr>
                        </table>
                    </div>
                    
                    <div class="map-box">
                        <iframe id="mapFrame" src="" allowfullscreen></iframe>
                    </div>
                </div>

                <div id="result" class="result-box">
                    <div class="status-msg">Gib oben eine Domain ein und klicke auf Abfragen.</div>
                </div>
            </section>
        </div>
    </body>
</html>
