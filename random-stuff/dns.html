<!DOCTYPE html>
<html lang="de">   
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Ein einfacher DNS-Lookup-Tool zum Auflösen von Domains in IP-Adressen.">
        <title>DNS Lookup | Team Wurstwasser</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="icon" type="image/png" sizes="256x256" href="/img/Logo.png">
        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="/css/dns.css">
        <script src="/js/setup.js" defer></script>
        <script src="/js/dns.js" defer></script>
    </head>

    <body>
        <header>
            <h1>DNS Lookup</h1>
            <p class="motto">Wandle eine Domain live in ihre IPv4- und IPv6-Adressen um:</p>
        </header>

        <div class="container">
            <a class="back-link" href="/random-stuff.html">← Zurück zur Random-Stuff Seite</a>

            <section class="card">
                <h2>Gib deine Domain ein:</h2>
                <div class="tool-ui">
                    <input type="text" id="domainInput" class="input-field" placeholder="z. B. team-wurstwasser.com" onkeydown="if(event.key === 'Enter') resolveDomain()">
                    <button onclick="resolveDomain()" class="btn" style="margin-top: 0;">Abfragen</button>
                </div>

                <div id="result" class="result-box">
                    <div class="status-msg">Gib oben eine Domain ein und klicke auf Abfragen.</div>
                </div>
            </section>
        </div>
    </body>
</html>
