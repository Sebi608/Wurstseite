<!DOCTYPE html>
<html lang="de">   
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DNS Lookup | Team Wurstwasser</title>
        <link rel="icon" type="image/png" href="../img/Logo.png">
        
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/dns.css">
        <script src="../js/seitenleiste.js" defer></script>
        <script src="../js/dns.js" defer></script>
    </head>

    <body>
        <header>
            <h1>DNS Lookup</h1>
            <p class="motto">Wandle eine Domain live in ihre IPv4- und IPv6-Adressen um:</p>
        </header>

        <div class="container">
            <a class="back-link" href="../index.html">← Zurück zur Startseite</a>

            <section class="card">
                <h2>Gib deine Domain ein:</h2>
                <div class="tool-ui">
                    <input type="text" id="domainInput" class="input-field" placeholder="z. B. team-wurstwasser.com" onkeydown="if(event.key === 'Enter') resolveDomain()">
                    <button onclick="resolveDomain()" class="btn" style="margin-top: 0;">Abfragen</button>
                </div>

                <div id="result" class="result-box">
                    <div class="status-msg">Gib oben eine Domain ein und klicke auf Abfragen.</div>
                </div>
            </section>
        </div>

        <footer>
            <ul>
                <li><a href="../index.html">&copy; 2026 Team Wurstwasser</a></li>
                <li><a href="../impressum.html">Impressum</a></li>
            </ul>
        </footer>
    </body>
</html>
