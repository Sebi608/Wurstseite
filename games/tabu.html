<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/games/tabu/words.js" defer></script>
  <script src="/js/games/tabu/tabu.js" defer></script>
  <link rel="stylesheet" href="/css/games/tabu.css">
  <title>Tabu Spiel</title>
</head>
<body>

  <div class="game-container">
    
    <!-- Status-Leiste -->
    <div class="header-bar">
      <div>Zeit: <span id="timer">60</span>s</div>
      <div>Punkte: <span id="score">0</span></div>
    </div>

    <!-- Start-Bildschirm -->
    <div id="start-screen" class="card">
      <h2>Bereit für Tabu?</h2>
      <p>Erkläre den Begriff oben, ohne die roten Wörter zu benutzen!</p>
      <button class="btn-start" onclick="startGame()">Spiel Starten</button>
    </div>

    <!-- Spiel-Karte -->
    <div id="game-screen" class="card hidden">
      <div id="target-word" class="target-word">LADE...</div>
      <ul id="taboo-list" class="taboo-list"></ul>
    </div>

    <!-- Aktions-Buttons -->
    <div id="controls" class="actions hidden">
      <button class="btn-wrong" onclick="nextCard(false)">Tabu! (-1)</button>
      <button class="btn-correct" onclick="nextCard(true)">Richtig (+1)</button>
    </div>

  </div>
</body>
</html>
